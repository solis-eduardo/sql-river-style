name: Release

# Disparado por tag (v1.0.0, v1.2.3...). Empacota o .vsix, cria a GitHub
# Release com ele anexado e, se o secret VSCE_PAT estiver configurado,
# publica no VS Code Marketplace também.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test
      - run: npx @vscode/vsce package --out sql-river-style.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: sql-river-style.vsix

  github-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vsix
      - uses: softprops/action-gh-release@v2
        with:
          files: sql-river-style.vsix
          generate_release_notes: true

  publish-marketplace:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vsix
      - name: Publish to VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        # Só publica se o secret VSCE_PAT existir no repo (Settings > Secrets
        # and variables > Actions). Sem ele, esse passo só avisa e sai — não
        # quebra o workflow nem impede a GitHub Release do outro job.
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "VSCE_PAT não configurado — pulando publish no Marketplace."
            exit 0
          fi
          npx @vscode/vsce publish --packagePath sql-river-style.vsix -p "$VSCE_PAT"
