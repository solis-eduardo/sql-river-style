name: Release

# Disparado por tag (v1.0.0, v1.2.3...). Empacota o .vsix, cria a GitHub
# Release com ele anexado e publica no VS Code Marketplace (secret VSCE_PAT
# já configurado em Settings > Secrets and variables > Actions).
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: npm test
      - run: npx @vscode/vsce package --out sql-river-style.vsix
      - uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: sql-river-style.vsix

  github-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: vsix
      - uses: softprops/action-gh-release@v3
        with:
          files: sql-river-style.vsix
          generate_release_notes: true

  publish-marketplace:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: vsix
      - name: Publish to VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx @vscode/vsce publish --packagePath sql-river-style.vsix -p "$VSCE_PAT"
